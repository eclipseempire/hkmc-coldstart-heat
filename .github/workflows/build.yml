name: Build packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Fail before building if the tag and the package disagree on the version.
      - name: Check the tag matches package/NEMESIS.data
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n '/^version=/{s///p;q}' package/NEMESIS.data | tr -d '\r')"
          if [ "$have" != "$want" ]; then
            echo "::error file=package/NEMESIS.data::version=$have, but the tag is $GITHUB_REF_NAME; bump it, then tag again"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # build-tools 30.0.3 is the last to ship dx (see tools/build_apk.sh).
      - name: Install Android build-tools 30.0.3 and android-30
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "build-tools;30.0.3" "platforms;android-30" > /dev/null
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"

      # tools/build_apk.sh signs with app/debug.jks (store and key password
      # "android", alias "cs") and makes a new one when it is missing. Store a
      # keystore base64-encoded in the APK_KEYSTORE_BASE64 secret to sign every
      # release with the same key.
      - name: Restore the signing key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$APK_KEYSTORE_BASE64" ]; then
            printf '%s' "$APK_KEYSTORE_BASE64" | base64 -d > app/debug.jks
          else
            echo "::notice::No APK_KEYSTORE_BASE64 secret; the APK is signed with a new throwaway key."
          fi

      - name: Build the APK
        run: bash tools/build_apk.sh

      - name: Bundle the zips
        run: |
          mkdir -p package/app
          cp app/coldstart.apk package/app/coldstart.apk
          bash tools/make_package.sh

      # What the device and the registry read from each zip.
      - name: Check the zip layouts
        run: |
          adb=dist/coldstart.heat.zip
          usb=dist/hkmc-coldstart-heat-USB.zip
          need() {
            unzip -Z1 "$1" | grep -xF "$2" > /dev/null || { echo "::error::$1 has no $2"; exit 1; }
          }
          need "$adb" NEMESIS.data
          for f in $(sed -n 's/^\(path\|postinstall\)=//p' package/NEMESIS.data | tr -d '\r'); do
            need "$adb" "$f"
          done
          need "$usb" NEMESIS.data
          inner="$(unzip -p "$usb" NEMESIS.data | sed -n 's/^path=//p')"
          need "$usb" "$inner"
          unzip -p "$usb" "$inner" | cmp -s - "$adb" || { echo "::error::$usb's $inner is not $adb"; exit 1; }
          unzip -l "$adb"
          unzip -l "$usb"

      - uses: actions/upload-artifact@v7
        with:
          name: hkmc-coldstart-heat
          path: |
            dist/coldstart.heat.zip
            dist/hkmc-coldstart-heat-USB.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hkmc-coldstart-heat
          path: dist

      # A release drafted for this tag beforehand (with its own title and notes)
      # gets the assets and stays a draft for you to publish. Otherwise the
      # release is created and published with generated notes; a tag with a
      # "-" (v1.4.0-beta) is marked as a pre-release, which the registry skips.
      # With immutable releases on, a published release can't take new assets,
      # so draft it, never publish it, before pushing the tag.
      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=(dist/coldstart.heat.zip dist/hkmc-coldstart-heat-USB.zip)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            flags=()
            [[ "$tag" == *-* ]] && flags+=(--prerelease)
            gh release create "$tag" "${assets[@]}" --verify-tag --title "$tag" --generate-notes "${flags[@]}"
          fi
